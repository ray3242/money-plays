[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tifxyz-snap"
version = "0.1.0"
description = "Snap approximate tifxyz surfaces onto the papyrus sheet in the raw CT (Vesuvius Challenge). CPU only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "tifffile", "requests", "matplotlib", "numcodecs"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tifxyz-snap = "tifxyz_snap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tifxyz_snap"]

[tool.ruff]
line-length = 160

[tool.pytest.ini_options]
testpaths = ["tests"]
