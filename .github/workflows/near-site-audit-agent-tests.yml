name: near-site-audit-agent tests
on:
  push:
    paths:
      - "near-site-audit-agent/**"
      - ".github/workflows/near-site-audit-agent-tests.yml"
  pull_request:
    paths:
      - "near-site-audit-agent/**"
      - ".github/workflows/near-site-audit-agent-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: near-site-audit-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
